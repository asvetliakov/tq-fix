; Contact-shadow approved defaults for the fixed, zoomed-out TQ camera.
; Merge these keys into the existing INI; restart the game after changing them.
; Full rationale and measurements: ../contact-tuning.md

[graphics]
shadow_contact=on
shadow_contact_steps=12
shadow_contact_length=0.35
shadow_contact_bias=0.012
shadow_contact_thickness=0.30
shadow_contact_strength=0.70
shadow_contact_upright=0.0

[debug]
shadow_contact_toggle=1
